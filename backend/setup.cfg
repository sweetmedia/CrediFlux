# Configuración de pytest de respaldo. Cuando exista pyproject.toml con
# [tool.pytest.ini_options] (migración a uv), pytest usa ése y ignora éste.
[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py *_test.py
testpaths = apps tests
addopts = -v --tb=short --strict-markers --reuse-db
markers =
    slow: pruebas lentas (crean schemas o recorren muchos datos)
    integration: pruebas que salen del proceso (servicios externos simulados)
