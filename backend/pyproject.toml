# Backend de CrediFlux. Dependencias gestionadas con uv (`uv sync`, `uv add`,
# `uv lock`); el lockfile es uv.lock.

[project]
name = "crediflux-backend"
version = "0.1.0"
description = "CrediFlux — backend Django multi-tenant (gestión de préstamos)"
requires-python = ">=3.11.5,<3.12"
dependencies = [
  # Core Django
  "django==5.0.9",
  "djangorestframework==3.15.2",
  "django-cors-headers==4.4.0",
  # Multi-tenant
  "django-tenants==3.6.1",
  # Database
  "psycopg2==2.9.11",
  "dj-database-url==2.2.0",
  # Authentication
  "django-allauth==0.63.6",
  "dj-rest-auth==6.0.0",
  "djangorestframework-simplejwt==5.3.1",
  "requests==2.32.5",
  # Admin
  "django-unfold==0.69.0",
  # API docs
  "drf-yasg==1.21.7",
  # drf-yasg 1.21 importa pkg_resources (setuptools). Con pip venía del Python
  # del sistema; un entorno de uv no trae setuptools. <81 conserva pkg_resources.
  "setuptools==79.0.1",
  # Configuración (el extra [database] no existe en 4.x: el backend DB viene incluido)
  "django-constance==4.1.2",
  "python-decouple==3.8",
  # Celery & Redis
  "celery==5.4.0",
  "redis==5.0.8",
  "django-redis==5.4.0",
  "django-celery-beat==2.7.0",
  # Utilidades
  "python-dateutil==2.9.0",
  "pillow==10.4.0",
  "phonenumbers==8.13.45",
  "django-phonenumber-field==8.0.0",
  # Scraping (DGII)
  "beautifulsoup4==4.12.3",
  "lxml==5.1.0",
  # Dinero
  "django-money==3.5.2",
  # Reportes y Excel
  "openpyxl==3.1.5",
  "xlsxwriter==3.2.0",
  "reportlab==4.2.2",
  # Seguridad
  "django-ratelimit==4.1.0",
  "django-filter==24.3",
  # 2FA
  "pyotp==2.9.0",
  "qrcode[pil]==8.0",
  # WhatsApp
  "pywa==3.4.0",
  # IA
  "djangosdk>=0.1.10",
  "litellm>=1.40.0",
  # Producción (antes requirements/production.txt)
  "gunicorn==23.0.0",
  "sentry-sdk==2.14.0",
  "boto3==1.35.19",
  "django-storages==1.14.4",
  "cryptography==43.0.3",
]

[dependency-groups]
dev = [
  "django-debug-toolbar==4.4.6",
  "django-extensions==3.2.3",
  "ipython==8.27.0",
  # Testing
  "pytest==8.3.3",
  "pytest-django==4.9.0",
  "pytest-cov==5.0.0",
  "factory-boy==3.3.1",
  "faker==28.4.1",
  "freezegun==1.5.1",
  "responses==0.25.3",
  # Calidad
  "ruff==0.8.4",
  "black==24.8.0",
  "flake8==7.1.1",
  "isort==5.13.2",
  "pylint==3.2.7",
]

[tool.uv]
# No es un paquete instalable: uv sólo gestiona el entorno.
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["apps", "tests"]
addopts = ["-v", "--tb=short", "--strict-markers", "--reuse-db"]
markers = [
  "slow: pruebas lentas (crean schemas o recorren muchos datos)",
  "integration: pruebas que salen del proceso (servicios externos simulados)",
]
filterwarnings = [
  "ignore:pkg_resources is deprecated:DeprecationWarning",
  "ignore:urllib3 .* doesn't match a supported version",
]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "*/management/commands/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", "static", "media", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F401", "F403", "F405"]
"**/tests/**" = ["B011"]
