# V2 docker-compose
# - project name `crediflux-v2` prefixes networks/volumes (e.g. crediflux-v2_postgres_data)
# - container_name lines removed so compose auto-prefixes them (no collisions with V1)
# - host ports remapped: V1 keeps 3000/8000/5432/6379/1025/8025/3001
#   V2 takes        3100/8100/5433/6380/1125/8125/3101
# - service-internal ports (db:5432, redis:6379, mailhog:1025, etc.) are unchanged because
#   each compose project has its own network — `db:5432` inside V2 talks to V2's db.
name: crediflux-v2

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_DB=crediflux_db
      - POSTGRES_USER=crediflux_user
      - POSTGRES_PASSWORD=crediflux_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crediflux_user -d crediflux_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1125:1025"  # SMTP server
      - "8125:8025"  # Web UI
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8100:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - backend

  celery-beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3100:3000"
    environment:
      - VITE_API_URL=http://localhost:8100
    depends_on:
      - backend

  documentation:
    build:
      context: ./documentation
      dockerfile: ../docker/documentation/Dockerfile
    command: npm run dev -- -p 3001
    ports:
      - "3101:3001"

volumes:
  postgres_data:
  static_volume:
  media_volume:
