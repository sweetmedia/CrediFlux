# CrediFlux Frontend Docker Compose
# Deploy: docker compose -f docker-compose.frontend.yml up -d --build
#
# SPA estática (Vite) servida por nginx. VITE_API_URL se incrusta en el
# bundle en tiempo de build: cambiarlo exige reconstruir la imagen.
# Backend should already be running on port 8600

services:
  crediflux-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://10.0.0.93:8600
        VITE_APP_URL: http://10.0.0.93:3600
    container_name: crediflux-frontend
    restart: unless-stopped
    ports:
      - "3600:3000"
    networks:
      - proxy_network
    labels:
      - "com.docker.compose.project=crediflux"

networks:
  proxy_network:
    external: true
