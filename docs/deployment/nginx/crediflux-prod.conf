# CrediFlux — nginx del host para producción (Cloudflare → nginx → contenedores en 127.0.0.1).
# Instalar en /etc/nginx/sites-available/crediflux-prod.conf, enlazar en sites-enabled y quitar
# crediflux-ssl.conf y los bloques app/demo/wildcard de crediflux.com.do (ver docs/deployment/VPS.md).
# Ajustar /opt/crediflux-prod si el repo vive en otra ruta.


upstream crediflux_backend { server 127.0.0.1:8700; keepalive 16; }
upstream crediflux_frontend { server 127.0.0.1:3700; keepalive 16; }

# HTTP → HTTPS (Cloudflare en modo "Full (strict)" ya llega por 443; esto cubre accesos directos).
server {
    listen 80;
    listen [::]:80;
    server_name app.crediflux.com.do ~^(?<tenant>[a-z0-9-]+)\.crediflux\.com\.do$;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;   # nginx 1.24 del VPS: aún sin la directiva http2 on
    listen [::]:443 ssl http2;
    # Cualquier subdominio menos los que tienen su propio server (www, design, la landing).
    server_name app.crediflux.com.do ~^(?<tenant>[a-z0-9-]+)\.crediflux\.com\.do$;

    # IP real del cliente (dentro del server: no afecta a otros sitios del host): sólo se cree a Cloudflare. Rangos de https://www.cloudflare.com/ips/
    # (revisar al instalar; cambian poco). Una petición directa al origen conserva su IP real y
    # no puede falsear CF-Connecting-IP.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Certificado de origen de Cloudflare (*.crediflux.com.do + crediflux.com.do).
    ssl_certificate /etc/nginx/ssl/crediflux-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/crediflux-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Subidas (cédulas, contratos, .p12): por encima del límite de la app (MAX_UPLOAD_SIZE_MB).
    client_max_body_size 20m;

    # Cabeceras comunes hacia el backend. X-Forwarded-For se REESCRIBE (no se encadena) con la
    # IP real: el backend corre con DRF_NUM_PROXIES=1 y toma el último valor.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /api/ {
        proxy_pass http://crediflux_backend;
        proxy_read_timeout 90s;
    }

    location /admin/ {
        proxy_pass http://crediflux_backend;
    }

    # Media sólo por URL firmada (SignedMediaView); el resto de /media/ no existe.
    location /media/s/ {
        proxy_pass http://crediflux_backend;
    }
    location /media/ {
        return 404;
    }

    # Documentación de la API: no se publica en producción.
    location ~ ^/(swagger|redoc)(/|\.json$) {
        return 404;
    }

    # Estáticos de Django (admin) que el contenedor deja con collectstatic.
    location /static/ {
        alias /opt/crediflux-prod/data/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # SPA (el nginx del contenedor ya pone Referrer-Policy y el fallback a index.html).
    location / {
        proxy_pass http://crediflux_frontend;
    }
}
