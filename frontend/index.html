    <!--
      Apariencia antes del primer paint (sin flash blanco en modo oscuro).
      Misma lógica que AppearanceProvider; la clave es 'cf-appearance'.
    -->
    <script>
      (function () {
        try {
          var k = 'cf-appearance';
          var m = localStorage.getItem(k);
          if (m !== 'light' && m !== 'dark' && m !== 'system') m = 'system';
          var d = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          if (d) r.classList.add('dark');
          else r.classList.remove('dark');
          r.style.colorScheme = d ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
