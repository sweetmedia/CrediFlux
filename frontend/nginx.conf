# SPA de CrediFlux. Escucha en 3000 para conservar el mapeo de puertos que
# tenía el servidor de Next (docker-compose.frontend.yml: 3600:3000).
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Assets con hash en el nombre: caché larga.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html nunca en caché: así un deploy nuevo se ve al recargar.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Rutas del cliente (React Router): todo lo que no sea un archivo va a index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
